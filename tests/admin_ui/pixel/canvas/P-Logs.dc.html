<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghidorah admin, phone: Request logs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th-light{--bg:#F7F5FB;--surface:#FFFFFF;--raised:#F3EFFA;--line:#ECE6F3;--line-strong:#DDD5E8;--control:#85758F;--text:#171321;--muted:#655A75;--faint:#76698A;--brand:#8B5CF6;--primary:#7C3AED;--primary-hover:#6D28D9;--primary-soft:#EDE9FE;--focus:#7C3AED;--ok:#047857;--ok-bg:#E2F4EC;--warn:#92400E;--warn-bg:#FDF1DF;--bad:#BE123C;--bad-bg:#FDE7EC;--info:#6D28D9;--info-bg:#EFE9FD;--neutral:#655A75;--neutral-bg:#F1EEF5;--bar-done:#7C3AED;--bar-run:#C4B5FD;--bar-fail:#E11D48;--topbar:#FFFFFF;--logo-dark:none;--logo-light:block;color-scheme:light}
.th-dark{--bg:#0E0B16;--surface:#171222;--raised:#211A30;--line:#2A2140;--line-strong:#3E3356;--control:#82738F;--text:#F5F3FF;--muted:#B9AEC9;--faint:#8E82A3;--brand:#8B5CF6;--primary:#7C3AED;--primary-hover:#6D28D9;--primary-soft:#2E1D4B;--focus:#A78BFA;--ok:#34D399;--ok-bg:rgba(52,211,153,.13);--warn:#FBBF24;--warn-bg:rgba(251,191,36,.13);--bad:#FB7185;--bad-bg:rgba(251,113,133,.14);--info:#C4B5FD;--info-bg:rgba(139,92,246,.2);--neutral:#B9AEC9;--neutral-bg:rgba(185,174,201,.12);--bar-done:#8B5CF6;--bar-run:#4C3A73;--bar-fail:#FB7185;--topbar:#130E1F;--logo-dark:block;--logo-light:none;color-scheme:dark}
a{color:var(--primary)}a:hover{color:var(--primary-hover)}
.th-dark a{color:#C4B5FD}
.gd ::selection{background:var(--primary-soft)}
.gd button,.gd input,.gd a,.gd select{font-family:inherit}
.gd button:focus-visible,.gd a:focus-visible,.gd input:focus-visible,.gd select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.tab:hover{color:var(--text)}
.ghost:hover{background:var(--raised)}
.solid:hover{background:var(--primary-hover)}
.danger:hover{background:var(--bad-bg)}
.lrow:hover{background:var(--raised)}
.logo-on-light{display:var(--logo-light)}
.logo-on-dark{display:var(--logo-dark)}
</style>
</helmet>
<div class="gd {{themeClass}}" style="width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 20px;">

<header style="background: var(--topbar); border-bottom: 1px solid var(--line);">
  <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px 0 16px; box-sizing: border-box;">
    <a href="#" aria-label="Ghidorah admin home" style="display: flex; align-items: center; flex: 1; min-width: 0; text-decoration: none;">
      <img class="logo-on-light" src="/_blob/d0a9f70a76dc022b6bc0d943aea30824" alt="Ghidorah" style="height: 24px; width: auto;">
      <img class="logo-on-dark" src="/_blob/4ddd6de2d45e1d36a76b14b677eae5e2" alt="Ghidorah" style="height: 24px; width: auto;">
    </a>
    <button type="button" aria-haspopup="listbox" aria-label="Provider scope: All" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer;">
      <span style="color: var(--muted);">Provider</span> All
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="ghost" type="button" aria-label="Switch theme" onClick="{{toggleTheme}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" aria-haspopup="menu" aria-label="Account menu, admin" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">A</span>
    </button>
  </div>
  <nav aria-label="Main" style="overflow-x: auto; border-top: 1px solid var(--line);">
    <ul style="list-style: none; margin: 0; padding: 0 8px; display: flex; gap: 4px; white-space: nowrap;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
        <li>
          <a class="tab" href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; box-sizing: border-box; text-decoration: none; font-size: 14px; font-weight: {{t.weight}}; color: {{t.color}}; border-bottom: 2px solid {{t.underline}};">
            {{t.label}}
            <sc-if value="{{t.count}}" hint-placeholder-val="{{ false }}"><span class="num" style="font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; background: {{t.countBg}}; color: {{t.countColor}};">{{t.count}}</span></sc-if>
          </a>
        </li>
      </sc-for>
    </ul>
  </nav>
</header>

<main style="flex: 1; padding: 16px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <div style="min-width: 0;">
      <h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em;">Request logs</h1>
      <p style="margin: 2px 0 0; color: var(--muted);">Every API request and its HTTP outcome. Jobs are listed separately.</p>
    </div>
    <div style="position: relative; flex: none;">
      <button class="ghost" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="{{menuExpanded}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ true }}">
        <div role="menu" aria-label="More actions" style="position: absolute; z-index: 5; right: 0; top: 50px; width: 200px; padding: 6px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 12px 32px rgba(10,6,20,.18);">
          <button class="danger" role="menuitem" type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--bad); font-size: 14px; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Clear logs</button>
        </div>
      </sc-if>
    </div>
  </div>

  <section aria-label="Request log list" style="background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;">
    <form role="search" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0 12px; border-bottom: 1px solid var(--line);">
      <div style="padding: 0 12px; position: relative; display: flex; align-items: center;">
        <label for="logSearch" style="position: absolute; left: -9999px;">Search</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 26px;"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="logSearch" type="search" placeholder="Job id, reference or title" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px 0 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 14px;">
      </div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 12px;">
        <label style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px;">
          <span style="color: var(--muted);">Status</span>
          <select value="All" style="height: 40px; border: 0; background: transparent; color: var(--text); font-size: 13px;">
            <option value="All">All</option><option value="OK below 400">OK below 400</option><option value="Errors">Errors</option><option value="Failed before a job">Failed before a job</option>
          </select>
        </label>
        <label style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px;">
          <span style="color: var(--muted);">From</span>
          <input type="date" value="2026-10-14" style="height: 40px; border: 0; background: transparent; color: var(--text); font-size: 13px;">
        </label>
        <label style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px;">
          <span style="color: var(--muted);">To</span>
          <input type="date" value="2026-10-15" style="height: 40px; border: 0; background: transparent; color: var(--text); font-size: 13px;">
        </label>
      </div>
    </form>

    <ul style="list-style: none; margin: 0; padding: 0;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
        <li>
          <sc-if value="{{r.isDay}}" hint-placeholder-val="{{ false }}">
            <h2 style="margin: 0; padding: 14px 16px 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line);">{{r.day}} <span class="num" style="font-weight: 400; color: var(--faint);">· {{r.dayNote}}</span></h2>
          </sc-if>
          <sc-if value="{{r.isReq}}" hint-placeholder-val="{{ true }}">
            <a class="lrow" href="#" aria-label="Open request {{r.rid}}" style="display: flex; flex-direction: column; gap: 6px; min-height: 72px; padding: 12px 16px; box-sizing: border-box; border-bottom: 1px solid var(--line); background: {{r.rowBg}}; color: var(--text); text-decoration: none;">
              <span style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                <span class="num" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--{{r.tone}}-bg); color: var(--{{r.tone}}); font-size: 12px; font-weight: 500;">
                  <span style="width: 6px; height: 6px; border-radius: 3px; background: var(--{{r.tone}});"></span>{{r.code}}</span>
                <span style="flex: 1; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.route}}</span>
              </span>
              <span style="display: flex; align-items: center; min-width: 0;">
                <sc-if value="{{r.hasJob}}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</span></sc-if>
                <sc-if value="{{r.noJob}}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; font-size: 11px; line-height: 16px; padding: 1px 8px; border-radius: 8px; background: var(--neutral-bg); color: var(--neutral);">no job</span></sc-if>
              </span>
              <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
                <span style="min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span class="num" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">{{r.time}}</span> · {{r.key}}</span>
                <span class="num" style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">{{r.ms}} ms</span>
              </span>
              <sc-if value="{{r.err}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--{{r.errTone}});">{{r.err}}</span></sc-if>
            </a>
          </sc-if>
        </li>
      </sc-for>
    </ul>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line);">
      <button type="button" class="ghost" aria-label="Previous page" aria-disabled="true" style="min-width: 88px; height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--faint); font-size: 14px;">Previous</button>
      <span class="num" style="font-size: 13px; color: var(--muted);">1 / 97</span>
      <button type="button" class="ghost" aria-label="Next page" style="min-width: 88px; height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--text); font-size: 14px; font-weight: 500;">Next</button>
    </div>
  </section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: null, menu: true };
  }
  renderVals() {
    const dark = this.state.dark === null ? (this.props.dark ?? false) : this.state.dark;
    const menu = this.state.menu;
    const tabNames = [['Jobs', '4'], ['Accounts', '7/8'], ['API keys'], ['Request logs', '', true], ['Alerts', '1', false, true], ['Prompt frames'], ['Settings'], ['Test']];
    const tabs = tabNames.map(([label, count, current, warn]) => ({
      label, href: '#', current: current ? 'page' : 'false', count: count || '',
      weight: current ? '600' : '500', color: current ? 'var(--text)' : 'var(--muted)',
      underline: current ? 'var(--primary)' : 'transparent',
      countBg: current ? 'var(--primary)' : (warn ? 'var(--warn-bg)' : 'var(--neutral-bg)'),
      countColor: current ? '#FFFFFF' : (warn ? 'var(--warn)' : 'var(--muted)')
    }));
    const VG = 'POST /v1/videos/generations';
    const IG = 'POST /v1/images/generations';
    const reqs = [
      { day: 'Today · 15 Oct', note: '7 requests shown', rid: 'rq_8f21c4', time: '20:54:22', code: 200, route: IG, key: 'Partner C', title: '(untitled)', hasJobId: true, ms: '388' },
      { rid: 'rq_8f21b9', time: '20:52:30', code: 200, route: VG, key: 'Shop A', title: 'Street food night market, handheld', hasJobId: true, ms: '431' },
      { rid: 'rq_8f21a0', time: '20:49:41', code: 200, route: 'GET /v1/models', key: 'Shop B', ms: '9' },
      { rid: 'rq_8f2187', time: '20:41:12', code: 200, route: VG, key: 'Shop A', title: 'Cat on a sofa, sunset light', hasJobId: true, ms: '412' },
      { rid: 'rq_8f2174', time: '20:33:48', code: 422, route: IG, key: 'Shop A', title: 'Product close-up, white marble', hasJobId: true, err: 'dola.content_refused', ms: '1,980' },
      { rid: 'rq_8f215e', time: '20:21:09', code: 400, route: VG, key: 'Partner B', err: 'input.bad_duration', ms: '9' },
      { rid: 'rq_8f2149', time: '20:07:15', code: 502, route: VG, key: 'Shop B', title: 'Rainy Tokyo crossing, 9:16', hasJobId: true, err: 'account.dead_session', ms: '2,140' },
      { day: 'Yesterday · 14 Oct', note: '5 of 4,761 requests shown', rid: 'rq_8e90d2', time: '23:58:10', code: 200, route: VG, key: 'Shop B', title: 'Lantern festival, slow pan', hasJobId: true, ms: '405' },
      { rid: 'rq_8e90c1', time: '23:41:55', code: 200, route: IG, key: 'Shop B', title: 'Kids drawing a dragon, crayon', hasJobId: true, ms: '372' },
      { rid: 'rq_8e90a8', time: '22:15:03', code: 200, route: 'GET /v1/jobs/{id}', key: 'Shop A', title: 'Logo reveal, purple smoke', hasJobId: true, ms: '14' },
      { rid: 'rq_8e9091', time: '19:52:40', code: 200, route: VG, key: 'Partner C', title: 'Logo reveal, purple smoke', hasJobId: true, ms: '447' },
      { rid: 'rq_8e907a', time: '10:02:18', code: 422, route: VG, key: 'Shop A', title: 'Crowd at a night festival', hasJobId: true, err: 'dola.content_refused', ms: '1,640' }
    ];
    const rows = [];
    reqs.forEach((q) => {
      if (q.day) rows.push({ isDay: true, isReq: false, day: q.day, dayNote: q.note });
      const tone = q.code < 400 ? 'ok' : (q.code < 500 ? 'warn' : 'bad');
      rows.push({
        ...q, isDay: false, isReq: true, tone,
        hasJob: !!q.hasJobId, noJob: !q.hasJobId,
        err: q.err || '', errTone: tone === 'bad' ? 'bad' : 'muted',
        rowBg: tone === 'bad' ? 'var(--bad-bg)' : 'transparent'
      });
    });
    return {
      themeClass: dark ? 'th-dark' : 'th-light',
      toggleTheme: () => this.setState({ dark: !dark }),
      toggleMenu: () => this.setState({ menu: !menu }),
      menuOpen: menu,
      menuExpanded: menu ? 'true' : 'false',
      tabs, rows
    };
  }
}
</script>
</body>
</html>
