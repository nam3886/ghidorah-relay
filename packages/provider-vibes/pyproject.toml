[project]
name = "relay-vibes"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "vibes provider: spec (pure) + engine (worker only, HTTP)"
dependencies = ["relay-core"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
relay-core = { workspace = true }
