[project]
name = "relay-grok"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "grok provider (grok.com Imagine images and videos): spec (pure) + engine (worker only, HTTP over curl_cffi; a browser sends a text to image)"
dependencies = ["relay-core", "relay-browser", "curl_cffi"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
relay-core = { workspace = true }
relay-browser = { workspace = true }
