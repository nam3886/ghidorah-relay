<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - relay</title>
    <link rel="stylesheet" href="/ui/vendor/admin.css">
</head>
<body class="h-full bg-background text-foreground antialiased">
    <div class="flex min-h-full flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center">
                <h1 class="text-4xl font-bold">relay</h1>
                <p class="mt-2 text-sm text-muted-foreground">Admin console</p>
            </div>
        </div>
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-background py-8 px-4 sm:px-10 rounded-lg">
                <form id="loginForm" method="post" class="space-y-6">
                    <div class="space-y-2">
                        <label for="username" class="text-sm font-medium">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50" placeholder="Enter your username">
                    </div>
                    <div class="space-y-2">
                        <label for="password" class="text-sm font-medium">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50" placeholder="Enter your password">
                    </div>
                    <button type="submit" id="loginButton" class="inline-flex items-center justify-center rounded-md font-medium transition-colors bg-primary text-primary-foreground hover:bg-primary/90 h-10 w-full disabled:opacity-50">Sign in</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/ui/common.js"></script>
    <script src="/ui/login.js"></script>
</body>
</html>
