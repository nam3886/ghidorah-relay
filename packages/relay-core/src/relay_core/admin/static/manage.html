<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - relay</title>
    <link rel="stylesheet" href="/ui/vendor/admin.css">
</head>
<body class="h-full bg-background text-foreground antialiased">
    <header class="sticky top-0 z-50 w-full border-b border-border/40 bg-background/95 backdrop-blur">
        <div class="mx-auto flex h-14 max-w-[1920px] items-center px-6">
            <div class="mr-4 flex items-baseline gap-3">
                <span class="font-bold text-xl">relay</span>
            </div>
            <div class="flex flex-1 items-center justify-end gap-3">
                <label class="text-xs text-muted-foreground" for="providerFilter">Provider</label>
                <select id="providerFilter" data-change="providerFilter" class="h-7 rounded-md border border-input bg-background px-2 text-xs">
                    <option value="">All</option>
                </select>
                <span id="whoami" class="text-xs text-muted-foreground"></span>
                <button data-act="logout" class="inline-flex items-center justify-center text-xs transition-colors hover:bg-accent hover:text-accent-foreground h-7 px-2.5 gap-1">Sign out</button>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-[1920px] px-6 py-6">
        <div id="alertsBanner" class="hidden mb-4 rounded-md border border-amber-300 bg-amber-50 text-amber-900 p-3 text-sm" role="status">
            <p class="font-semibold mb-1">Needs attention</p>
            <ul id="alertsList" class="list-disc pl-5 space-y-0.5"></ul>
        </div>
        <div id="statsCards" class="grid gap-4 grid-cols-2 md:grid-cols-4 lg:grid-cols-7 mb-6"></div>
        <div class="border-b border-border mb-6">
            <nav id="tabNav" class="flex space-x-8"></nav>
        </div>
        <div id="panels"></div>
    </main>
    <div id="modalRoot"></div>

    <script src="/ui/common.js"></script>
    <script src="/ui/tables.js"></script>
    <script src="/ui/stats.js"></script>
    <script src="/ui/tab-accounts.js"></script>
    <script src="/ui/tab-keys.js"></script>
    <script src="/ui/tab-jobs.js"></script>
    <script src="/ui/tab-logs.js"></script>
    <script src="/ui/tab-frames.js"></script>
    <script src="/ui/tab-alerts.js"></script>
    <script src="/ui/tab-settings.js"></script>
    <script src="/ui/tab-test.js"></script>
    <script src="/ui/manage.js"></script>
</body>
</html>
