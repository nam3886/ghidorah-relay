[project]
name = "relay-dola"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "dola provider: spec (pure) + engine (worker only)"
dependencies = ["relay-core", "relay-browser", "curl_cffi", "cryptography"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
relay-core = { workspace = true }
relay-browser = { workspace = true }
