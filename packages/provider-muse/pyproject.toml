[project]
name = "relay-muse"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "muse provider: spec (pure) + engine (worker only, HTTP and a Noise WebSocket)"
dependencies = ["relay-core", "curl_cffi", "cryptography"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
relay-core = { workspace = true }
