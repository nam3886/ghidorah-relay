[project]
name = "relay-gpt"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "gpt provider (chatgpt.com images): spec (pure) + engine (worker only, HTTP over curl_cffi)"
dependencies = ["relay-core", "curl_cffi"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
relay-core = { workspace = true }
