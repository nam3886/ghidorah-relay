[project]
name = "relay-cli"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "The relay command: serve, worker, migrate, admin"
dependencies = ["relay-core", "relay-dola", "relay-vibes", "relay-meta", "relay-flow", "relay-gemini",
                "relay-qwen"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project.scripts]
relay = "relay_cli.main:main"

[tool.uv.sources]
relay-core = { workspace = true }
relay-dola = { workspace = true }
relay-vibes = { workspace = true }
relay-meta = { workspace = true }
relay-flow = { workspace = true }
relay-gemini = { workspace = true }
relay-qwen = { workspace = true }
