[project]
name = "relay-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "Ghidorah Relay workspace: one API for AI image and video generation"
dependencies = [
    "relay-core",
    "relay-browser",
    "relay-dola",
    "relay-vibes",
    "relay-meta",
    "relay-flow",
    "relay-gemini",
    "relay-qwen",
    "relay-cli",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "pyyaml>=6", "ruff>=0.8", "openai>=1.50", "google-genai>=1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/admin-web"]

[tool.uv.sources]
relay-core = { workspace = true }
relay-browser = { workspace = true }
relay-dola = { workspace = true }
relay-vibes = { workspace = true }
relay-meta = { workspace = true }
relay-flow = { workspace = true }
relay-gemini = { workspace = true }
relay-qwen = { workspace = true }
relay-cli = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]   # %-formatting is the house style

[tool.ruff.lint.isort]
known-first-party = ["relay_core", "relay_browser", "relay_dola", "relay_vibes", "relay_meta", "relay_flow",
                     "relay_gemini", "relay_qwen", "relay_cli"]
known-local-folder = ["guards"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps"]
addopts = "-q --strict-markers"
markers = [
    "browser: needs Google Chrome; runs in the browser image through scripts/check-in-container.sh",
    "web_unit: runs Vitest specs of apps/admin-web in the web image (tests/webunit.py); only scripts/mutate.py runs these, by node id",
    "box: proves the box image (Linux Chrome .deb, Xvfb, entry script); runs only in scripts/check-in-container.sh",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]   # the FastAPI parameter idiom
