# One box, one compose. Runs on the LAN box by IP and port; no reverse proxy.
# No service shares an env file: every service names its own `<service>.env`, copied from its
# `<service>.env.example` (variable names only). `api` and `migrate` never see the private credential key
# (I20); tests/test_deploy.py parses this file to keep it so.
# `migrate` and `api` sit in the profile `app`, provider workers in `dola`, `vibes`, `meta`, `flow`, `gemini`,
# `qwen` and `muse`:
# `docker compose --profile app --profile dola up -d` starts the api and the dola worker, and nothing in this
# file changes when a provider is enabled. A bare `docker compose up` starts only Postgres and MinIO.
# Every compose command needs GIT_SHA (and the two passwords) in the environment or in deploy/.env, because
# compose interpolates the services of inactive profiles too: `export GIT_SHA=$(git rev-parse --short HEAD)`.
# Images are named `relay-<service>:${GIT_SHA}` so a rollback is a retag, not a rebuild.
# Every service runs under CPU, memory and PID limits from its first start (the *_CPUS, *_MEM_LIMIT and *_PIDS_LIMIT
# variables, in deploy/.env): the defaults hold relay to at most half of the 32-core, 62 GB box. They change only
# through a recorded deploy (docs/operations.md, "Limits and abort thresholds").
name: relay

# Every service logs to a rotated json-file (at most 100 MB a container; tests/guards.py deploy_violations holds every
# service to a bounded driver). A recreated container starts with an empty log, so scripts/deploy.sh and rollback.sh
# keep the old container's log in ~/relay-logs/<service>/ before each `up -d` (docs/operations.md, "Logs").
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

x-app: &app
  logging: *logging
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: relay
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay}"]
      interval: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-4}
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-512}

  minio:
    # pgsty/minio pinned by digest: upstream stopped publishing images (401 on 30/09). The image is also
    # saved off the box; docs/operations.md lists the digest, the tarball and the exit (Garage).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    pull_policy: missing
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped
    cpus: ${MINIO_CPUS:-2}
    mem_limit: ${MINIO_MEM_LIMIT:-2g}
    pids_limit: ${MINIO_PIDS_LIMIT:-512}

  migrate:
    <<: *app
    profiles: [app]
    image: relay-migrate:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [migrate.env]
    command: ["relay", "migrate"]
    restart: "no"
    cpus: ${MIGRATE_CPUS:-1}
    mem_limit: ${MIGRATE_MEM_LIMIT:-1g}
    pids_limit: ${MIGRATE_PIDS_LIMIT:-256}

  api:
    <<: *app
    profiles: [app]
    image: relay-api:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [api.env]
    command: ["relay", "serve"]
    ports: ["${API_PORT:-8100}:8100"]
    stop_grace_period: 30s    # in-flight requests finish; the kill comes after
    cpus: ${API_CPUS:-2}
    mem_limit: ${API_MEM_LIMIT:-2g}
    pids_limit: ${API_PIDS_LIMIT:-512}

  worker-dola:
    <<: *app
    profiles: [dola]
    image: relay-worker-dola:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: browser}
    env_file: [worker-dola.env]
    command: ["relay", "worker", "--provider", "dola"]
    # The profiles volume is mounted at /profiles, the code's PROFILE_ROOT (relay_browser/session.py): cold profiles
    # caused the composer re-queues and ~13 MB a load. The number of browser slots is the live setting
    # dola.browser_slots, not an environment variable.
    shm_size: 1g
    stop_grace_period: 780s   # the longest submit timeout (video 720 s) plus a minute to release leases
    volumes: ["profiles-dola:/profiles"]
    cpus: ${DOLA_CPUS:-8}
    mem_limit: ${DOLA_MEM_LIMIT:-12g}
    pids_limit: ${DOLA_PIDS_LIMIT:-2048}

  worker-meta:
    <<: *app
    profiles: [meta]
    image: relay-worker-meta:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: browser}
    env_file: [worker-meta.env]
    command: ["relay", "worker", "--provider", "meta"]
    shm_size: 1g
    stop_grace_period: 780s   # the longest submit timeout meta's settings allow (720 s) plus a minute
    # Warm profiles on the volume at /profiles (PROFILE_ROOT), like worker-dola; the number of browser slots is the
    # live setting meta.browser_slots.
    volumes: ["profiles-meta:/profiles"]
    cpus: ${META_CPUS:-4}
    mem_limit: ${META_MEM_LIMIT:-6g}
    pids_limit: ${META_PIDS_LIMIT:-1024}

  worker-vibes:
    <<: *app
    profiles: [vibes]
    image: relay-worker-vibes:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [worker-vibes.env]
    command: ["relay", "worker", "--provider", "vibes"]
    stop_grace_period: 780s   # the worker's own stop grace (720 s, DEFAULT_GRACE_S) plus a minute; no browser, no volume
    cpus: ${VIBES_CPUS:-1}
    mem_limit: ${VIBES_MEM_LIMIT:-1g}
    pids_limit: ${VIBES_PIDS_LIMIT:-256}

  worker-flow:
    <<: *app
    profiles: [flow]
    image: relay-worker-flow:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [worker-flow.env]
    command: ["relay", "worker", "--provider", "flow"]
    stop_grace_period: 780s   # the worker's own stop grace (720 s, DEFAULT_GRACE_S) plus a minute; no browser, no volume
    cpus: ${FLOW_CPUS:-1}
    mem_limit: ${FLOW_MEM_LIMIT:-1g}
    pids_limit: ${FLOW_PIDS_LIMIT:-256}

  worker-gemini:
    <<: *app
    profiles: [gemini]
    image: relay-worker-gemini:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [worker-gemini.env]
    command: ["relay", "worker", "--provider", "gemini"]
    stop_grace_period: 780s   # the worker's own stop grace (720 s, DEFAULT_GRACE_S) plus a minute; no browser, no volume
    cpus: ${GEMINI_CPUS:-1}
    mem_limit: ${GEMINI_MEM_LIMIT:-1g}
    pids_limit: ${GEMINI_PIDS_LIMIT:-256}

  worker-qwen:
    <<: *app
    profiles: [qwen]
    image: relay-worker-qwen:${GIT_SHA:?set GIT_SHA}
    # The browser image: every qwen call is plain HTTP, but Chrome mints the anti-bot pair (bx-ua, bx-umidtoken) the
    # paid call needs, one browser at a time. Warm profiles on the volume keep chat.qwen.ai's scripts cached.
    build: {context: .., dockerfile: deploy/Dockerfile, target: browser}
    env_file: [worker-qwen.env]
    command: ["relay", "worker", "--provider", "qwen"]
    shm_size: 1g
    volumes: ["profiles-qwen:/profiles"]          # PROFILE_ROOT in relay_browser/session.py
    stop_grace_period: 780s   # the longest submit timeout (image 720 s) plus a minute to release leases
    cpus: ${QWEN_CPUS:-2}
    mem_limit: ${QWEN_MEM_LIMIT:-3g}
    pids_limit: ${QWEN_PIDS_LIMIT:-1024}

  worker-muse:
    <<: *app
    profiles: [muse]
    image: relay-worker-muse:${GIT_SHA:?set GIT_SHA}
    build: {context: .., dockerfile: deploy/Dockerfile, target: http}
    env_file: [worker-muse.env]
    command: ["relay", "worker", "--provider", "muse"]
    stop_grace_period: 780s   # the worker's own stop grace (720 s, DEFAULT_GRACE_S) plus a minute; no browser, no volume
    cpus: ${MUSE_CPUS:-1}
    mem_limit: ${MUSE_MEM_LIMIT:-1g}
    pids_limit: ${MUSE_PIDS_LIMIT:-256}

volumes:
  pgdata:
  miniodata:
  profiles-dola:
  profiles-meta:
  profiles-qwen:
